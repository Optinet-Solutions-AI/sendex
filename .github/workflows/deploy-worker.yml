name: Deploy worker

on:
  push:
    branches: [main]
    paths:
      - "apps/worker/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Runs only once the Fly.io app exists and FLY_API_TOKEN is set as a repository secret.
    if: ${{ vars.FLY_DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Resolve the release version
        id: version
        run: echo "version=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - run: flyctl deploy --remote-only --config apps/worker/fly.toml --dockerfile apps/worker/Dockerfile --build-arg SENDEX_VERSION=${{ steps.version.outputs.version }} .
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
