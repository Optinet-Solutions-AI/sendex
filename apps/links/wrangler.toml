name = "sendex-links"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# See docs/engineering/links-and-clicks.md for the full setup (domains, WAF, rate limit).

# Non-secret configuration. INTERNAL_API_SECRET is a secret, never a var:
#   wrangler secret put INTERNAL_API_SECRET
# It must equal the worker's INTERNAL_API_SECRET (same value in Fly.io secrets).
[vars]
SENDEX_VERSION = "dev"
# Origin of apps/worker; the redirect falls back to `${WORKER_URL}/internal/links/:code`
# on a KV miss and posts clicks to `${WORKER_URL}/internal/clicks` when no queue is bound.
WORKER_URL = "https://sendex-worker.fly.dev"

# KV namespace for short code -> link lookups (key `code:<shortCode>`, 30 day TTL).
# Create with:  wrangler kv namespace create LINKS
#               wrangler kv namespace create LINKS --preview
# and paste the ids below. Until then the service resolves every code through the worker.
[[kv_namespaces]]
binding = "LINKS"
id = "00b6bae8d7e8452ab0279cf9881b64fc"
preview_id = "e09b7c9aef4749b6a3a618c85c3d3605"

# Click records. Create the queue with:  wrangler queues create sendex-clicks
# then uncomment both blocks. Without the producer binding the redirect posts each click
# straight to the worker over HTTP (batch of one), so the queue is an optimisation, not a need.
# [[queues.producers]]
# binding = "CLICKS"
# queue = "sendex-clicks"
#
# [[queues.consumers]]
# queue = "sendex-clicks"
# max_batch_size = 100
# max_batch_timeout = 5
# max_retries = 5
# dead_letter_queue = "sendex-clicks-dead"
