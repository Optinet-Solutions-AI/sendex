# Local services for development and integration tests.
# Start: docker compose up -d     Stop: docker compose down
# No Docker on your machine? Use Supabase for Postgres, Upstash (or WSL redis-server) for Redis.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sendex
      POSTGRES_PASSWORD: sendex
      POSTGRES_DB: sendex
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sendex"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # No SMPP container: the carrier path is exercised by the in-process simulator shipped with
  # `@sendex/providers` (`startSimulator()` in packages/providers/src/smpp/simulator.ts). The
  # provider tests start it on a free loopback port, so `pnpm test` needs no Docker at all.
  # See docs/engineering/providers/smpp.md.

volumes:
  pgdata:
