pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,jsx,ts,tsx,json,jsonc,css}"
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    typecheck:
      run: pnpm typecheck
    gitleaks:
      run: node scripts/gitleaks.mjs

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
